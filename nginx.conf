server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API calls to devotee-api (global prefix api/v1)
    location /api {
        # Docker's embedded DNS — re-resolve on each request instead of
        # caching the upstream IP for the worker's lifetime (that cache
        # goes stale if devotee-api is recreated/redeployed).
        resolver 127.0.0.11 valid=10s;
        set $devotee_api devotee-api;
        proxy_pass http://$devotee_api:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
